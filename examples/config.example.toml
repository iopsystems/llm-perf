# llm-perf Configuration Example
# This file demonstrates all available configuration options.
# Copy this file and uncomment/modify options as needed for your use case.

# =============================================================================
# Endpoint Configuration
# =============================================================================
[endpoint]
# Base URL of the OpenAI-compatible API endpoint
base_url = "http://localhost:8080/v1"

# Model name to use for requests
# If omitted, llm-perf will query the /v1/models endpoint to auto-detect
# Example: "llama-3.1-8b-instruct", "gpt-4", etc.
# model = "llama-3.1-8b-instruct"

# Request timeout in seconds
# Default: 60
timeout = 60

# Maximum number of tokens to generate per response (optional)
# If set, this value is sent as max_tokens in every request body.
# This config value takes precedence over per-prompt max_tokens in the input JSONL.
# max_tokens = 128

# API key for authentication (if required by your server)
# api_key = "sk-..."

# Additional headers to send with every request. Useful for providers that
# require custom headers (for example, OpenCode Go requires
# `x-opencode-session`).
# [endpoint.extra_headers]
# x-opencode-session = "my-session-id"

# Retry Configuration
# Number of times to retry failed requests (0 = no retries)
# Retriable errors: timeouts, connection errors, HTTP 5xx server errors
# Non-retriable errors: HTTP 4xx client errors, parse errors
# Default: 0 (no retries)
# max_retries = 3

# Initial delay before first retry in milliseconds
# Delay grows exponentially with jitter: base_delay * 2^attempt * (0.5-1.0)
# Default: 100ms
# retry_initial_delay_ms = 100

# Maximum retry delay in milliseconds (caps exponential growth)
# Default: 10000ms (10 seconds)
# retry_max_delay_ms = 10000
# Note: the configured `timeout` also bounds the TOTAL time of a logical request
# including all retries and backoff, so retries never blow far past the timeout.

# Per-read idle timeout for streaming responses, in seconds (0 = disabled, default).
# Detects a stalled-but-open stream that the total request timeout can miss under
# HTTP/2 keep-alive. Set to a value comfortably above the model's slowest expected
# inter-token gap to avoid false timeouts.
# stream_idle_timeout = 30

# Retry requests that timed out. Default: false. A timed-out chat completion may
# still be running server-side, so retrying re-fires an expensive, non-idempotent
# generation. Connection and 5xx errors are always retried regardless of this.
# retry_on_timeout = false

# Exact tokenizer for sizing synthetic prompts and truncation. Either a local
# tokenizer.json path or a HuggingFace model id (downloaded + cached). When unset,
# llm-perf calibrates a tiktoken estimate against the server's /tokenize endpoint
# if available, otherwise falls back to a rough tiktoken estimate (tiktoken does
# NOT match non-OpenAI models like Llama/Qwen/Mistral). Server-reported token
# counts are always used for the headline metrics where available.
# tokenizer = "Qwen/Qwen2.5-7B-Instruct"     # HF model id
# tokenizer = "/models/qwen/tokenizer.json"  # or a local path

# Server Readiness Check Configuration (Optional)
# IMPORTANT: Readiness check is DISABLED by default (health_check_timeout = 0)
# When enabled, llm-perf polls /v1/models until the server is ready
# Useful when starting the server and llm-perf simultaneously (e.g., vLLM loading models)
# Works with all OpenAI-compatible backends since /v1/models is required by the spec

# Maximum time to wait for server to become ready (in seconds)
# Set to > 0 to enable readiness checking
# Default: 0 (disabled)
# health_check_timeout = 300

# Interval between readiness check retries (in seconds)
# Default: 5
# health_check_interval = 5

# =============================================================================
# Load Configuration
# =============================================================================
[load]
# LOAD PATTERN: Choose between concurrent mode or fixed QPS mode
# If 'qps' is set -> Fixed QPS mode
# If 'qps' is NOT set -> Concurrent mode

# --- Concurrent Mode Settings ---
# Number of concurrent workers sending requests
# In concurrent mode: This is the main load control
# In fixed QPS mode: This is the max in-flight requests limit
# Default: 10
concurrent_requests = 10

# --- Fixed QPS Mode Settings ---
# Target queries per second (enables fixed QPS mode when set)
# Example: 10.0 = 10 requests per second
# qps = 10.0

# Request arrival distribution pattern (only applies to QPS mode)
# Options:
#   - "uniform" (default): Fixed intervals between requests (deterministic)
#   - "poisson": Variable intervals following exponential distribution (realistic traffic)
# Default: "uniform"
# arrival_distribution = "uniform"

# QPS mode only: cap on outstanding (in-flight + queued) requests. When the server
# can't sustain the offered rate, requests beyond the cap are dropped and counted
# as overload (reported as "Overload: N of M offered dropped") instead of queueing
# without bound. Default: max(concurrent_requests * 100, 100000) — generous enough
# never to trip in a healthy run; set lower to model a bounded queue, or very high
# to effectively disable. To find the sustainable rate/concurrency, prefer
# saturation mode (see below).
# max_outstanding_requests = 5000

# --- Test Duration Settings ---
# Specify EITHER total_requests OR duration_seconds (not both)

# Total number of requests to send
total_requests = 100

# OR: Run for a specific duration in seconds
# duration_seconds = 60

# --- Warmup Settings ---
# Warmup phase to exclude cold start effects from metrics
# Specify EITHER warmup_requests OR warmup_duration (or neither)

# Number of warmup requests to send before main test
# warmup_requests = 10

# OR: Warmup duration in seconds
# warmup_duration = 5

# =============================================================================
# Input Configuration
# =============================================================================
[input]
# Source of per-request prompts. Options:
#   - Path to a JSONL file (single-turn or ShareGPT multi-turn)
#   - A known dataset name for auto-download from HuggingFace:
#       "openorca", "sharegpt", "toolbench", "gpt4-tool-use", "claude-distill"
#   - "synthetic" to generate prompts via [input.synthetic]
#
# Known dataset names (downloaded and cached on first use):
#   "openorca"      — Open-Orca/OpenOrca GPT-4 subset (~1 GB download, 1M single-turn prompts)
#   "sharegpt"      — ShareGPT Vicuna conversations (~670 MB download, ~90K multi-turn conversations)
#   "toolbench"     — THUDM/ToolBench (~300 MB, tool-use trajectories)
#   "gpt4-tool-use" — openai/gpt-4-tool-use-v1.0 (~200 MB, GPT-4 tool calling examples)
#   "claude-distill"— Kassadin88/Claude-Distills (~800 MB, Claude Sonnet/Opus distillations with system prompts)
#
# Custom JSONL formats:
#   Single-turn: {"prompt": "your prompt here", "max_tokens": 100}
#   Multi-turn (ShareGPT): {"conversations": [{"from": "human", "value": "Hello"}, {"from": "gpt", "value": "Hi!"}, ...]}
#
# ShareGPT format notes:
#   - Roles: "human"/"user" for user turns, "gpt"/"assistant" for model turns, "system" for system prompt
#   - Model responses in the dataset are ignored — the actual model generates responses
#   - Each conversation occupies one worker slot for all its turns (tests KV cache / prefix caching)
#   - Both formats can be mixed in the same file
#   - max_tokens is optional per prompt/conversation
#
# Synthetic prompt generation:
#   - file = "synthetic" to generate synthetic prompts
#   - max_tokens in [endpoint] is required for synthetic mode to control maximum output length
#   - prompt_tokens controls the prompt length
#   - prompt_tokens_stdev, prompt_tokens_min, prompt_tokens_max (optional) control variability and limits of prompt lengths
#   - common_prefix_sample_ratio (default: 0.0) controls the ratio of generated prompts that share a common prefix
#   - common_prefix_tokens (default: 0) controls the token length of the shared common prefix
#   example that generates 10k synthetic prompts with 512 input tokens and maximum 512 output tokens:
#   [endpoint]
#   max_tokens = 512
#   [input]
#   file = "synthetic"
#   sample_size = 10000
#   [input.synthetic]
#   prompt_tokens = 512
#
#   example that generates multi-turn synthetic conversations (3 turns each):
#   [input]
#   file = "synthetic"
#   sample_size = 100
#   [input.synthetic]
#   prompt_tokens = 128
#   turns = 3
#   turn_prompt_tokens = 96

file = "examples/prompts/openorca-10000.jsonl"

# Seed for deterministic, reproducible runs.
# In file/dataset mode: shuffles prompts with this seed for reproducible ordering.
# In synthetic mode: seeds the prompt generator for reproducible synthetic prompts.
# If not set, file mode uses file order; synthetic mode uses a default seed (42).
# seed = 42

# Control dataset size:
# In file/dataset mode: take the first N prompts from the file (applied before shuffling)
# In synthetic mode: generate exactly N prompts (default: 10000)
# sample_size = 100

# =============================================================================
# System Prompt (Optional)
# Always sent clean — never modified per-request, never cache-busted.
# Pick exactly one of: content, file, or tokens.
# =============================================================================
# [input.system_prompt]
# content = "You are a helpful assistant."   # inline
# file    = "prompts/system.md"              # from disk
# tokens  = 2048                             # synthetic, fixed seed

# =============================================================================
# Shared Prefix (Optional)
# A fixed block prepended to every first user turn.
# Requests tagged [shared] (expected hit) or [bust-N] (expected miss).
#
# miss_rate = 0.0 → all requests expected to hit after warmup (decode-sweep)
# miss_rate = 1.0 → all requests expected to miss (prefill-sweep with large context)
# miss_rate = 0.1 → 10% of requests bust the cache to measure pipeline bubbles
# =============================================================================
# [input.shared_prefix]
# tokens    = 8192    # synthetic, fixed seed (or: content = "..." / file = "path")
# miss_rate = 0.1     # fraction of requests that get [bust-N] prefix (default: 0.0)

# =============================================================================
# Conversation Configuration (Optional)
# =============================================================================
# Models user "think time" between turns of a multi-turn conversation. With
# default settings, llm-perf sends the next user turn as soon as the previous
# response stream ends — that exercises either fully-resident or fully-evicted
# KV-cache regimes, but never the realistic "evicted-then-reloaded" case that
# KV offloading targets. Setting a non-zero turn_delay_ms inserts a sampled
# sleep between turns so conversations pause like a real user reading and
# typing.
#
# A delay is sampled per gap from a Gaussian centered at turn_delay_ms with
# stdev turn_delay_stdev_ms, clamped to [turn_delay_min_ms, turn_delay_max_ms].
# Default behavior (section omitted, or all values left at defaults) is
# identical to back-to-back turns.
#
# Applies to every multi-turn source (synthetic, ShareGPT, etc.). The
# conversation's worker slot remains held during the sleep — turns-per-second
# at a fixed concurrent_requests drops accordingly, which matches real chat
# users keeping the seat warm while idle.
# [conversation]
# turn_delay_ms       = 15000   # mean pause between turns, ms
# turn_delay_stdev_ms = 0       # Gaussian stdev; 0 = deterministic
# turn_delay_min_ms   = 0       # clamp floor, ms
# turn_delay_max_ms   = 60000   # clamp ceiling, ms

# =============================================================================
# Output Configuration
# =============================================================================
[output]
# Output format for results
# Options: "console" (default), "json"
#
# console: Human-readable output with detailed metrics
# json:    Machine-readable structured output
#          - With file: writes JSON to file, shows brief summary
#          - Without file: outputs JSON to stdout (for piping)
#
# Default: "console"
format = "console"

# Output file path (optional, only used for json format)
# - If specified: JSON written to file, brief summary to console
# - If omitted: JSON written to stdout (for piping to jq, etc.)
# file = "results.json"

# Suppress periodic stats output during benchmark
# Useful for quiet operation or when JSON goes to stdout
# Default: false
# quiet = false

# Enable detailed trace logging to file
# trace_log = "trace.log"

# =============================================================================
# Runtime Configuration
# =============================================================================
[runtime]
# Number of Tokio worker threads
# Default: number of CPU cores
# worker_threads = 8

# =============================================================================
# Logging Configuration
# =============================================================================
[log]
# Log level for console output
# Options: "error", "warn", "info", "debug", "trace"
# Default: "info"
level = "info"

# =============================================================================
# Metrics Configuration (Optional)
# =============================================================================
# Enable high-resolution metrics capture to Parquet files
# Useful for detailed performance analysis and graphing
# [metrics]
# output = "metrics.parquet"
# interval = "1s"  # Snapshot interval (e.g., "1s", "500ms", "1m")
# batch_size = 1000  # Parquet batch size
#
# Server-side metrics capture (optional): spawns `rezolus record` to scrape the
# server-under-test's Prometheus /metrics on the same interval and write a parquet
# time-aligned with the client metrics (join on the wall-clock timestamp).
# Requires the `rezolus` binary on PATH (or set rezolus_bin).
# server_metrics_url = "http://localhost:4242/metrics"
# server_metrics_output = "metrics.server.parquet"  # default: <output-stem>.server.parquet
# rezolus_bin = "rezolus"                             # binary to invoke

# =============================================================================
# Admin Server Configuration (Optional)
# =============================================================================
# HTTP server for live metrics viewing during benchmark
# [admin]
# enabled = true
# listen = "127.0.0.1:9090"

# =============================================================================
# Logprobs Configuration (Optional)
# =============================================================================
# Capture token-level log probabilities during benchmark runs.
# Useful for comparing quantized models via KL divergence analysis.
# Usage: Run benchmarks with logprobs enabled, then compare with:
#   llm-perf kl-divergence baseline.jsonl candidate.jsonl
#
# [logprobs]
# enabled = true
# top_logprobs = 5       # Number of top token probabilities to capture (1-20)
# output = "logprobs.jsonl"  # Path to write JSONL output

# =============================================================================
# Saturation Search Configuration (Optional)
# =============================================================================
# Automatically discover the maximum concurrency a server can handle while
# maintaining SLO compliance.
#
# When enabled, the saturation search controls concurrency — the load section's
# concurrent_requests is ignored. You still need duration_seconds or
# total_requests set (the search terminates on its own, not on duration).
#
# The search climbs concurrency multiplicatively until an SLO breaks, re-probes
# from a drained state to rule out transient/metastable failures, then binary-
# searches the exact ceiling and confirms it over several windows. The summary
# reports the max compliant concurrency, the saturation onset (knee), and any
# transient recoveries.
#
# [saturation]
# start_concurrency = 1         # Starting concurrency level
# step_multiplier = 1.5         # Multiplicative climb step before the first SLO break
# sample_window = "60s"         # How long to measure at each concurrency level
# max_concurrency = 256         # Absolute ceiling on concurrency
# min_throughput_ratio = 0.9    # Plateau gate: tokens/s must stay >= 90% of the
#                               # throughput projected from the previous rung
# confirm_windows = 3           # Windows to confirm the final boundary (M-of-N);
#                               # higher is more noise-robust but slower
# drain_settle_ms = 500         # Settle time after draining before measuring a rung
# # drain_timeout_secs = 60     # Max wait for in-flight to drain (default: sample_window)
# # stop_after_failures = 3     # DEPRECATED and ignored (warns if set); the search
# #                             # now bisects + confirms instead of stopping after N
#
# # SLO thresholds — set any combination of TTFT, ITL, TPOT at p50/p99/p999.
# # At least one threshold must be specified.
# [saturation.slo.ttft]
# p99_ms = 500.0               # TTFT p99 must stay under 500ms
#
# [saturation.slo.tpot]
# p99_ms = 50.0                # TPOT p99 must stay under 50ms
# p999_ms = 100.0              # TPOT p999 must stay under 100ms

# =============================================================================
# Experiment Recipes
# =============================================================================
#
# Prefill-sweep (unique inputs, measure raw prefill throughput):
#   [input]
#   file = "synthetic"
#   [input.synthetic]
#   prompt_tokens = 512
#   prompt_tokens_stdev = 128
#   [endpoint]
#   max_tokens = 1
#
# Decode-sweep (large shared prefix, all cache hits after warmup):
#   [input.shared_prefix]
#   tokens = 8192
#   miss_rate = 0.0
#   [input.synthetic]
#   prompt_tokens = 32    # short unique suffix
#
# Mixed — 10% cache miss rate (study prefill pipeline bubbles):
#   [input.shared_prefix]
#   tokens = 4096
#   miss_rate = 0.1
#   [input.synthetic]
#   prompt_tokens = 64
#
# =============================================================================

# =============================================================================
# Common Configuration Patterns
# =============================================================================

# Workload Patterns
# -----------------

# Pattern 1: Simple Concurrent Load Test
# [load]
# concurrent_requests = 10
# total_requests = 100

# Pattern 2: Fixed QPS with Uniform Arrival (Capacity Testing)
# [load]
# qps = 10.0
# arrival_distribution = "uniform"
# concurrent_requests = 20
# total_requests = 1000

# Pattern 3: Fixed QPS with Poisson Arrival (Realistic Traffic)
# [load]
# qps = 10.0
# arrival_distribution = "poisson"
# concurrent_requests = 20
# duration_seconds = 60

# Pattern 4: Duration-Based Soak Test
# [load]
# concurrent_requests = 10
# duration_seconds = 300  # 5 minutes
# warmup_duration = 10

# Pattern 5: Multi-Turn Conversations (Agentic Workload)
# Use a ShareGPT-format JSONL file to test realistic multi-turn chat performance.
# Each conversation runs its turns sequentially through one worker, measuring
# TTFT growth with conversation depth and prefix caching effectiveness.
#
# For agentic workloads with specific system instructions, use the claude-distill
# dataset (automatically downloaded from HuggingFace) with a system prompt override:
# [input]
# file = "claude-distill"  # Auto-downloads Claude Sonnet/Opus distillations
# [input.system_prompt]
# content = "You are Claude, a helpful AI assistant. Follow these guidelines:..."
# [load]
# concurrent_requests = 20  # 20 concurrent conversations
# duration_seconds = 120

# Feature Examples
# ----------------
# These features can be combined with any workload pattern above

# Auto-Detect Model from Server
# [endpoint]
# base_url = "http://localhost:8080/v1"
# # Omit 'model' field - will query /v1/models endpoint

# High-Resolution Metrics Capture
# [metrics]
# output = "benchmark_metrics.parquet"
# interval = "1s"
#
# After the test, you can analyze the parquet file with tools like:
# - pandas (Python)
# - DuckDB (SQL)
# - Apache Arrow (various languages)
